name: Verify Fuzzy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated API types
        run: |
          bun run generate:types
          git diff --exit-code -- packages/shared/src/generated

      - name: Verify TypeScript, UI, and Rust
        run: bun run verify

      - name: Build unsigned Windows distribution smoke artifact
        run: bun run dist:windows

      - name: Upload unsigned Windows distribution smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fuzzy-Windows-unsigned-${{ github.sha }}
          path: dist/Fuzzy-*-windows/
          if-no-files-found: error
          retention-days: 7
